name: Destroy GCP Resources

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DESTROY to confirm resource deletion"
        required: true
        type: string

permissions:
  contents: read

# Shares the deploy group on purpose: a destroy never runs alongside a deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: meridian-ai-cloud-run
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/meridian-ai-cloud-run
  VECTOR_BUCKET: gs://${{ secrets.GCP_PROJECT_ID }}-vector-staging
  # Created implicitly by `gcloud builds submit` to stage uploaded source. Note the underscore.
  CLOUDBUILD_BUCKET: gs://${{ secrets.GCP_PROJECT_ID }}_cloudbuild
  INDEX_NAME: financial-docs-production
  ENDPOINT_NAME: financial-docs-endpoint

jobs:
  destroy:
    name: Destroy GCP Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Validate Confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "DESTROY" ]]; then
            echo "Invalid confirmation."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Every deletion step below is continue-on-error so that one stuck resource
      # (Vertex AI in particular) can never strand the bucket or the registry.
      # The final step re-reads every outcome and fails the job if anything broke.

      # Step 1: Delete Cloud Run
      - name: Delete Cloud Run Service
        id: cloud_run
        continue-on-error: true
        run: |
          if gcloud run services describe "$SERVICE_NAME" \
            --region="$REGION" \
            --project="$PROJECT_ID" >/dev/null 2>&1; then

            gcloud run services delete "$SERVICE_NAME" \
              --region="$REGION" \
              --project="$PROJECT_ID" \
              --quiet
          else
            echo "Cloud Run service not found."
          fi

      # Step 2: Undeploy Vertex AI Index
      - name: Undeploy Vector Search Index
        id: undeploy_index
        continue-on-error: true
        run: |
          ENDPOINT_ID=$(gcloud ai index-endpoints list \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --filter="displayName=$ENDPOINT_NAME" \
            --format="value(name)" \
            --limit=1)

          if [[ -z "$ENDPOINT_ID" ]]; then
            echo "Endpoint not found."
            exit 0
          fi

          # --flatten gives one id per line. A bare value(deployedIndexes.id) joins
          # repeated fields with ';', which the loop below would read as a single id.
          DEPLOYED_IDS=$(gcloud ai index-endpoints describe "$ENDPOINT_ID" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --flatten="deployedIndexes[]" \
            --format="value(deployedIndexes.id)")

          for DEPLOYED_ID in $DEPLOYED_IDS; do
            echo "Undeploying $DEPLOYED_ID"
            gcloud ai index-endpoints undeploy-index "$ENDPOINT_ID" \
              --deployed-index-id="$DEPLOYED_ID" \
              --region="$REGION" \
              --project="$PROJECT_ID" \
              --quiet
          done

          # The index cannot be deleted while it is still attached, so wait for the
          # endpoint to report zero deployed indexes before later steps run.
          for attempt in $(seq 1 30); do
            REMAINING=$(gcloud ai index-endpoints describe "$ENDPOINT_ID" \
              --region="$REGION" \
              --project="$PROJECT_ID" \
              --flatten="deployedIndexes[]" \
              --format="value(deployedIndexes.id)" 2>/dev/null || true)

            if [[ -z "$REMAINING" ]]; then
              echo "All indexes undeployed."
              break
            fi

            echo "Attempt $attempt/30: still undeploying... waiting 30 seconds."
            sleep 30
          done

      # Step 3: Delete Vertex AI Endpoint
      - name: Delete Vector Search Endpoint
        id: delete_endpoint
        continue-on-error: true
        run: |
          ENDPOINT_ID=$(gcloud ai index-endpoints list \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --filter="displayName=$ENDPOINT_NAME" \
            --format="value(name)" \
            --limit=1)

          if [[ -n "$ENDPOINT_ID" ]]; then
            gcloud ai index-endpoints delete "$ENDPOINT_ID" \
              --region="$REGION" \
              --project="$PROJECT_ID" \
              --quiet
          else
            echo "Endpoint not found."
          fi

      # Step 4: Delete Vertex AI Index
      - name: Delete Vector Search Index
        id: delete_index
        continue-on-error: true
        run: |
          INDEX_ID=$(gcloud ai indexes list \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --filter="displayName=$INDEX_NAME" \
            --format="value(name)" \
            --limit=1)

          if [[ -n "$INDEX_ID" ]]; then
            gcloud ai indexes delete "$INDEX_ID" \
              --region="$REGION" \
              --project="$PROJECT_ID" \
              --quiet
          else
            echo "Index not found."
          fi

      # Step 5: Delete Storage Buckets
      - name: Delete GCS Buckets
        id: delete_buckets
        continue-on-error: true
        run: |
          FAILED=0

          # `rm --recursive gs://bucket` removes every object version and then the
          # bucket itself. On an already-empty bucket some gcloud versions report
          # "matched no objects", so fall back to an explicit bucket delete.
          for BUCKET in "$VECTOR_BUCKET" "$CLOUDBUILD_BUCKET"; do
            if ! gcloud storage buckets describe "$BUCKET" \
              --project="$PROJECT_ID" >/dev/null 2>&1; then
              echo "Bucket $BUCKET not found."
              continue
            fi

            echo "Deleting $BUCKET ..."
            if ! gcloud storage rm --recursive "$BUCKET" --project="$PROJECT_ID" --quiet; then
              echo "Recursive delete failed for $BUCKET; trying explicit bucket delete."
              gcloud storage buckets delete "$BUCKET" --project="$PROJECT_ID" --quiet || true
            fi

            if gcloud storage buckets describe "$BUCKET" \
              --project="$PROJECT_ID" >/dev/null 2>&1; then
              echo "ERROR: $BUCKET still exists."
              FAILED=1
            else
              echo "Deleted $BUCKET"
            fi
          done

          exit "$FAILED"

      # Step 6: Delete Secret Manager Secret
      - name: Delete Secret
        id: delete_secret
        continue-on-error: true
        run: |
          if gcloud secrets describe GOOGLE_API_KEY \
            --project="$PROJECT_ID" >/dev/null 2>&1; then

            gcloud secrets delete GOOGLE_API_KEY \
              --project="$PROJECT_ID" \
              --quiet
          else
            echo "Secret not found."
          fi

      # Step 7: Delete Container Images
      - name: Delete Container Images
        id: delete_images
        continue-on-error: true
        shell: bash
        run: |
          echo "Deleting container images from $IMAGE_NAME"

          IMAGES=$(gcloud container images list-tags "$IMAGE_NAME" \
            --project="$PROJECT_ID" \
            --format=json 2>/dev/null | jq -r '.[].digest // empty' || true)

          if [[ -z "$IMAGES" ]]; then
            echo "No container images found."
            exit 0
          fi

          while IFS= read -r DIGEST; do
            [[ -z "$DIGEST" ]] && continue

            # Validate complete SHA256 digest
            if [[ ! "$DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
              echo "ERROR: Invalid SHA256 digest: $DIGEST"
              exit 1
            fi

            echo "Deleting image: ${IMAGE_NAME}@${DIGEST}"

            gcloud container images delete \
              "${IMAGE_NAME}@${DIGEST}" \
              --project="$PROJECT_ID" \
              --force-delete-tags \
              --quiet

          done <<< "$IMAGES"

          echo "All container images deleted successfully."

      # Step 8: Delete the Artifact Registry repositories themselves.
      # Deleting image digests (step 7) empties the repo but leaves it behind.
      # Container Registry shut down in March 2025, so gcr.io/<project> is really
      # an Artifact Registry repo named "gcr.io" in the "us" multi-region.
      - name: Delete Artifact Registry Repositories
        id: delete_artifact_repos
        continue-on-error: true
        run: |
          # Deleting a repo needs artifactregistry.repositories.delete. Self-grant it
          # the same way the deploy workflow grants itself run.admin/secretmanager.admin.
          DEPLOYER_SA=$(gcloud config get account 2>/dev/null)
          echo "Granting Artifact Registry Admin to $DEPLOYER_SA ..."
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/artifactregistry.admin" --condition=None >/dev/null 2>&1 \
            || echo "Could not self-grant artifactregistry.admin; continuing."

          echo "--- Repositories currently in project ---"
          gcloud artifacts repositories list --project="$PROJECT_ID" \
            --format="table(name,format,location)" || echo "(list failed)"

          # Explicit location:repo pairs, per Google's documented gcr.io mapping
          # (gcr.io -> us, eu.gcr.io -> europe, asia.gcr.io -> asia).
          # Deliberately NOT parsed out of `repositories list`: that command's `name`
          # field is a short id in some gcloud releases and a full resource path in
          # others, and guessing wrong silently skips the repo. Addressing each repo
          # directly also means unrelated repos are never touched.
          CANDIDATES="us:gcr.io us:us.gcr.io europe:eu.gcr.io asia:asia.gcr.io ${REGION}:cloud-run-source-deploy"

          FAILED=0
          DELETED=0

          repo_exists() {
            # Echoes "yes"/"no", or "error" when the check itself could not run
            # (for example PERMISSION_DENIED) so it is never mistaken for "absent".
            local repo="$1" loc="$2" out
            if out=$(gcloud artifacts repositories describe "$repo" \
                       --location="$loc" --project="$PROJECT_ID" 2>&1); then
              echo "yes"
            elif grep -qiE 'not found|does not exist|NOT_FOUND' <<<"$out"; then
              echo "no"
            else
              echo "error: $out"
            fi
          }

          for CANDIDATE in $CANDIDATES; do
            LOCATION="${CANDIDATE%%:*}"
            REPO_ID="${CANDIDATE#*:}"

            STATUS=$(repo_exists "$REPO_ID" "$LOCATION")

            case "$STATUS" in
              no)
                echo "No repository $REPO_ID in $LOCATION."
                continue
                ;;
              error*)
                echo "ERROR: could not check $REPO_ID in $LOCATION: ${STATUS#error: }"
                FAILED=1
                continue
                ;;
            esac

            echo "Deleting Artifact Registry repo $REPO_ID in $LOCATION ..."
            gcloud artifacts repositories delete "$REPO_ID" \
              --location="$LOCATION" \
              --project="$PROJECT_ID" \
              --quiet || echo "Delete command reported an error for $REPO_ID."

            # Trust the API, not the command's exit code: re-check that it is gone.
            if [[ "$(repo_exists "$REPO_ID" "$LOCATION")" == "no" ]]; then
              echo "Deleted $REPO_ID in $LOCATION."
              DELETED=$((DELETED + 1))
            else
              echo "ERROR: $REPO_ID in $LOCATION still exists after delete."
              FAILED=1
            fi
          done

          echo "--- Repositories remaining ---"
          gcloud artifacts repositories list --project="$PROJECT_ID" \
            --format="table(name,format,location)" || echo "(list failed)"

          echo "Repositories deleted: $DELETED"
          exit "$FAILED"

      - name: Cleanup Summary
        if: always()
        env:
          R_CLOUD_RUN: ${{ steps.cloud_run.outcome }}
          R_UNDEPLOY: ${{ steps.undeploy_index.outcome }}
          R_ENDPOINT: ${{ steps.delete_endpoint.outcome }}
          R_INDEX: ${{ steps.delete_index.outcome }}
          R_BUCKETS: ${{ steps.delete_buckets.outcome }}
          R_SECRET: ${{ steps.delete_secret.outcome }}
          R_IMAGES: ${{ steps.delete_images.outcome }}
          R_REPOS: ${{ steps.delete_artifact_repos.outcome }}
        run: |
          FAILED=0

          report() {
            printf '%-28s %s\n' "$1" "$2"
            [[ "$2" == "success" ]] || FAILED=1
          }

          echo "=== Destroy results ==="
          report "Cloud Run service"      "$R_CLOUD_RUN"
          report "Vector index undeploy"  "$R_UNDEPLOY"
          report "Vector endpoint"        "$R_ENDPOINT"
          report "Vector index"           "$R_INDEX"
          report "GCS buckets"            "$R_BUCKETS"
          report "Secret Manager secret"  "$R_SECRET"
          report "Container images"       "$R_IMAGES"
          report "Artifact Registry repos" "$R_REPOS"

          if [[ "$FAILED" -ne 0 ]]; then
            echo ""
            echo "Some resources were not deleted. Re-run this workflow; it skips what is already gone."
            exit 1
          fi

          echo ""
          echo "GCP application resources deleted."
